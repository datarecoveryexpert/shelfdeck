name: New poster theme
description: Propose a procedural poster theme for the cover engine.
labels: ["theme", "cover-engine"]
body:
  - type: input
    id: name
    attributes:
      label: Theme name
      placeholder: "e.g. Neon Arcade"
    validations:
      required: true
  - type: textarea
    id: concept
    attributes:
      label: Concept
      description: Visual idea, typography, colors and which metadata it highlights (language, stars, parameter count…).
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Best suited for
      multiple: true
      options:
        - GitHub repositories
        - Hugging Face models
        - Hugging Face datasets / spaces
        - Generic web tools
  - type: textarea
    id: mockup
    attributes:
      label: Sketch or mockup
      description: Drag and drop images here.
