name: Feature request
description: Suggest an idea or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Which usage tier does this affect?
      multiple: true
      options:
        - "Tier 1: local library (no account)"
        - "Tier 2: user API keys"
        - "Tier 3: GitHub sync & sharing"
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: This works without a ShelfDeck-operated server.
          required: true
